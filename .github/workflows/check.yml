name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Format, lint and test
        run: |
          cargo +1.93.0 fmt --all --check
          cargo +1.93.0 clippy --locked --all-targets -- -D warnings
          cargo +1.93.0 test --locked --all-targets
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE and pinned Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 gcc pkg-config
          sudo modprobe fuse
          rustup toolchain install 1.93.0 --profile minimal
      - name: Build normal and crash-injection binaries
        run: |
          mkdir -p .runs/bin
          cargo +1.93.0 build --release --locked
          cp target/release/witnessfs .runs/bin/witnessfs
          cargo +1.93.0 build --release --locked --features fault-injection
          cp target/release/witnessfs .runs/bin/witnessfs-fault
      - name: Actual kernel, crash and demo checks
        # Run as the ordinary runner user in the disposable Linux VM.
        # Docker's default AppArmor profile denies mounts on this host.
        run: |
          export PATH="$PWD/.runs/bin:$PATH"
          WITNESS_RESULTS="$PWD/.runs/kernel-tests.json" python3 tests/fuse_integration.py
          python3 scripts/record_demo.py --output .runs/demo.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-evidence
          path: .runs/*.json
